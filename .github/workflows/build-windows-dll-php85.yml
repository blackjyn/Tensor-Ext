name: Build Windows DLL (PHP 8.5)

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-windows-dll-php85.yml"
      - "tensor/**"
      - "ext/**"
      - "config.json"
      - "composer.json"
  pull_request:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/build-windows-dll-php85.yml"
      - "tensor/**"
      - "ext/**"
      - "config.json"
  workflow_dispatch:

jobs:
  build-windows-dll-php85:
    name: PHP 8.5 x64 NTS DLL Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.5 with development headers
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: json
          tools: composer
          coverage: none

      - name: Verify PHP installation
        shell: cmd
        run: |
          echo === PHP Info ===
          php -v
          php -i | findstr /C:"PHP Version" /C:"Compiler" /C:"Architecture"
          php -r "echo 'PHP Path: ' . PHP_PREFIX . PHP_EOL;"

      - name: Install build tools and dependencies
        shell: cmd
        run: |
          echo === Installing build tools ===
          choco install -y cmake ninja visualstudio2022buildtools visualstudio2022-workload-vctools

          REM Setup vcpkg
          if not exist "C:\vcpkg" (
            echo Cloning vcpkg...
            git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          )

          cd /d C:\vcpkg
          if not exist "vcpkg.exe" (
            echo Building vcpkg...
            call bootstrap-vcpkg.bat
          )

          echo Installing packages via vcpkg...
          vcpkg integrate install
          vcpkg install openblas:x64-windows lapack:x64-windows --triplet x64-windows

      - name: Set up build environment
        shell: powershell
        run: |
          $phpPath = (Get-Command php.exe).Source | Split-Path
          $phpConfig = Join-Path $phpPath "php-config.exe"

          if (Test-Path $phpConfig) {
            Write-Output "Found php-config at: $phpConfig"
            $phpVersion = & $phpConfig --version
            $phpPrefix = & $phpConfig --prefix
            $phpInclude = & $phpConfig --includes
            Write-Output "PHP Version: $phpVersion"
            Write-Output "PHP Prefix: $phpPrefix"
            Write-Output "PHP Includes: $phpInclude"
          } else {
            Write-Output "WARNING: php-config not found, using php.exe directory"
          }

          "PHP_PATH=$phpPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_HOME=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENBLAS_HOME=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LAPACK_HOME=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SKIP_PHPIZE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Composer dependencies
        shell: cmd
        run: |
          echo === Installing Composer dependencies ===
          composer install --prefer-dist --no-progress --no-interaction

      - name: Generate Zephir code
        shell: cmd
        run: |
          echo === Generating Zephir extension code ===
          composer generate
          if errorlevel 1 exit /b 1

      - name: Compile Zephir extension for Windows
        shell: cmd
        run: |
          echo === Compiling Zephir extension for Windows ===
          setlocal enabledelayedexpansion

          REM Windows does not provide phpize
          set SKIP_PHPIZE=1
          set ZEPHIR_PLATFORM=windows

          echo Attempting standard Zephir compile...
          call composer compile 2>&1

          if errorlevel 1 (
            echo WARNING: Standard compile failed because phpize is unavailable on Windows.
            echo Attempting Zephir C generation fallback...

            if exist "vendor\bin\zephir.bat" (
              call vendor\bin\zephir.bat generate --no-dev
              if errorlevel 1 (
                echo ERROR: Zephir generation failed
                exit /b 1
              )
            ) else (
              echo ERROR: Zephir CLI not found
              exit /b 1
            )
          )

          echo === Verifying generated C files ===
          if exist "ext\*.c" (
            echo Found generated C files in ext directory
            dir /b ext\*.c | findstr /V "kernel" | head -10
          ) else (
            echo ERROR: No C files generated in ext directory
            dir /s ext
            exit /b 1
          )

          echo === Listing generated files in ext directory ===
          dir /s ext\*.c ext\*.h 2>nul | findstr /V "kernel" | head -20

      - name: Build DLL using nmake
        shell: cmd
        run: |
          echo === Building DLL ===
          cd ext

          for /f "delims=" %%i in ('php -r "echo PHP_VERSION_ID;"') do set PHP_VERSION_ID=%%i
          for /f "delims=" %%i in ('php -r "echo PHP_PREFIX;"') do set PHP_PREFIX=%%i

          echo PHP_VERSION_ID=%PHP_VERSION_ID%
          echo PHP_PREFIX=%PHP_PREFIX%

          REM Setup Visual Studio environment
          set "VsDevCmd=C:\Program Files\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\VsDevCmd.bat"
          if exist "%VsDevCmd%" (
            echo Setting up Visual Studio environment...
            call "%VsDevCmd%" -arch=x64 -host_arch=x64
          ) else (
            echo WARNING: VsDevCmd.bat not found, attempting without it...
          )

          REM Create a minimal Makefile.win32 if the Zephir build didn't provide one.
          if not exist "Makefile.win32" (
            echo Creating minimal Makefile.win32...
            (
              echo ZEPHIR_CFLAGS=/DZEPHIR_RELEASE=1 /O2 /GL /Oy /Oi /Ot /Og /Oy
              echo PHP_INCLUDES=/I "%PHP_PREFIX%\include"
              echo OBLAS_INCLUDES=/I "%OPENBLAS_HOME%\include"
              echo LAPACK_INCLUDES=/I "%LAPACK_HOME%\include"
              echo.
              echo OBJS=tensor_ext.obj
              echo.
              echo all: php_tensor.dll
              echo.
              echo php_tensor.dll: $^(OBJS^)
              echo   link.exe /DLL /OUT:php_tensor.dll $^(OBJS^) "%PHP_PREFIX%\lib\php.lib"
              echo.
              echo tensor_ext.obj: tensor_ext.c
              echo   cl.exe /c /DZEPHIR_RELEASE=1 $^(PHP_INCLUDES^) $^(OBLAS_INCLUDES^) $^(LAPACK_INCLUDES^) tensor_ext.c
              echo.
              echo clean:
              echo   del *.obj *.dll 2^>nul
            ) > Makefile.win32
            echo Makefile.win32 created successfully
          )

          if not exist "Makefile.win32" (
            echo ERROR: Failed to create Makefile.win32
            exit /b 1
          )

          echo === Attempting nmake build ===
          nmake /f Makefile.win32 clean
          if exist "php_tensor.dll" del php_tensor.dll
          nmake /f Makefile.win32

          if errorlevel 1 (
            echo Build failed!
            exit /b 1
          )

      - name: Find and verify DLL
        shell: powershell
        run: |
          Write-Output "=== Searching for compiled DLL ==="
          $dlls = @()

          Get-ChildItem -Path "." -Recurse -Include "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "Found DLL: $($_.FullName)"
            if ($_.Name -match "tensor|php_tensor") {
              $dlls += $_.FullName
            }
          }

          if ($dlls.Count -eq 0) {
            Write-Output "ERROR: No tensor DLL found!"
            Write-Output "=== Contents of ext directory ==="
            Get-ChildItem -Path "ext" -Recurse
            exit 1
          }

          $targetDll = $dlls[0]
          Write-Output "✓ Using DLL: $targetDll"
          Write-Output "  Size: $($(Get-Item $targetDll).Length) bytes"

          "DLL_PATH=$targetDll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create artifact
        shell: powershell
        run: |
          Write-Output "=== Preparing artifact ==="
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          if ($env:DLL_PATH -and (Test-Path $env:DLL_PATH)) {
            Copy-Item -Path "$env:DLL_PATH" -Destination "artifact\php_tensor-8.5-x64-nts.dll" -Verbose
            Write-Output "✓ Artifact ready:"
            Get-ChildItem artifact
          } else {
            Write-Output "ERROR: DLL_PATH not set or file not found!"
            exit 1
          }

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: tensor-php85-x64-nts
          path: artifact/php_tensor-8.5-x64-nts.dll
          retention-days: 90
          if-no-files-found: error

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: artifact/php_tensor-8.5-x64-nts.dll
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          body: |
            # Tensor Extension ${{ github.ref_name }} - PHP 8.5 Windows Binary

            **Pre-built DLL for Windows (PHP 8.5 x64 NTS)**

            ## Files
            - `php_tensor-8.5-x64-nts.dll`

            ## Installation
            1. Download `php_tensor-8.5-x64-nts.dll`
            2. Place it in your PHP `ext/` directory
            3. Add to `php.ini`:
               ```
               extension=php_tensor.dll
               ```
            4. Verify:
               ```
               php -m | find "tensor"
               ```

            ## Build Details
            - PHP Version: 8.5 (NTS)
            - Architecture: x64 (64-bit)
            - Compiled with OpenBLAS and LAPACK via vcpkg
            - Built on: ${{ github.event.head_commit.timestamp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture debug logs on failure
        if: failure()
        shell: powershell
        run: |
          Write-Output "`n=== Build Failure Diagnostics ==="
          Write-Output "PHP Environment:"
          php -v
          composer --version

          Write-Output "`nVisual Studio Tools:"
          where cl.exe
          where nmake.exe
          where zephir

          Write-Output "`nDirectory Contents:"
          Write-Output "=== ext directory ==="
          Get-ChildItem ext -Include "*.obj","*.dll","*.exe","*.lib","Makefile*","*.c","*.h" -Recurse | Select-Object FullName, Length | Head -50

          if (Test-Path "ext\config.log") {
            Write-Output "`n=== config.log (first 100 lines) ==="
            Get-Content ext\config.log -Head 100
          }

          Write-Output "`n=== Build artifacts ==="
          Get-ChildItem -Path "." -Recurse -Include "*.dll" -ErrorAction SilentlyContinue | Select-Object FullName
