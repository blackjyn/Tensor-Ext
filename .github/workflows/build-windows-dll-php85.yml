name: Build Windows DLL (PHP 8.5)

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-windows-dll-php85.yml"
      - "tensor/**"
      - "ext/**"
      - "config.json"
      - "composer.json"
  pull_request:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/build-windows-dll-php85.yml"
      - "tensor/**"
      - "ext/**"
      - "config.json"
  workflow_dispatch:

jobs:
  build-windows-dll-php85:
    name: PHP 8.5 x64 NTS DLL Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.5 with development headers
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: json
          tools: composer
          coverage: none

      - name: Verify PHP installation
        shell: cmd
        run: |
          echo === PHP Info ===
          php -v
          php -i | findstr /C:"PHP Version" /C:"Compiler" /C:"Architecture"
          php -r "echo 'PHP Path: ' . PHP_PREFIX . PHP_EOL;"

      - name: Install build tools and dependencies
        shell: cmd
        run: |
          echo === Installing build tools ===
          choco install -y cmake ninja visualstudio2022buildtools visualstudio2022-workload-vctools

          REM Setup vcpkg
          if not exist "C:\vcpkg" (
            echo Cloning vcpkg...
            git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          )

          cd /d C:\vcpkg
          if not exist "vcpkg.exe" (
            echo Building vcpkg...
            call bootstrap-vcpkg.bat
          )

          echo Installing packages via vcpkg...
          vcpkg integrate install
          vcpkg install openblas:x64-windows lapack:x64-windows --triplet x64-windows

      - name: Set up build environment
        shell: powershell
        run: |
          $phpPath = (Get-Command php.exe).Source | Split-Path
          $phpConfig = Join-Path $phpPath "php-config.exe"

          if (Test-Path $phpConfig) {
            Write-Output "Found php-config at: $phpConfig"
            $phpVersion = & $phpConfig --version
            $phpPrefix = & $phpConfig --prefix
            $phpInclude = & $phpConfig --includes
            Write-Output "PHP Version: $phpVersion"
            Write-Output "PHP Prefix: $phpPrefix"
            Write-Output "PHP Includes: $phpInclude"
          } else {
            Write-Output "WARNING: php-config not found, using php.exe directory"
          }

          "PHP_PATH=$phpPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_HOME=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENBLAS_HOME=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LAPACK_HOME=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SKIP_PHPIZE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Composer dependencies
        shell: cmd
        run: |
          echo === Installing Composer dependencies ===
          composer install --prefer-dist --no-progress --no-interaction

      - name: Generate Zephir code
        shell: cmd
        run: |
          echo === Generating Zephir extension code ===
          composer generate
          if errorlevel 1 exit /b 1

      - name: Compile Zephir extension for Windows
        shell: cmd
        run: |
          echo === Compiling Zephir extension for Windows ===
          setlocal enabledelayedexpansion

          REM Windows does not provide phpize
          set SKIP_PHPIZE=1
          set ZEPHIR_PLATFORM=windows

          echo Attempting standard Zephir compile...
          call composer compile 2>&1

          if errorlevel 1 (
            echo WARNING: Standard compile failed because phpize is unavailable on Windows.
            echo Attempting Zephir C generation fallback...

            if exist "vendor\bin\zephir.bat" (
              call vendor\bin\zephir.bat generate --no-dev
              if errorlevel 1 (
                echo ERROR: Zephir generation failed
                exit /b 1
              )
            ) else (
              echo ERROR: Zephir CLI not found
              exit /b 1
            )
          )

          echo === Verifying generated C files ===
          if exist "ext\*.c" (
            echo Found generated C files in ext directory
            dir /b ext\*.c | findstr /V "kernel" | head -10
          ) else (
            echo ERROR: No C files generated in ext directory
            dir /s ext
            exit /b 1
          )

          echo === Listing generated files in ext directory ===
          dir /s ext\*.c ext\*.h 2>nul | findstr /V "kernel" | head -20

      - name: Build DLL using nmake
        shell: cmd
        run: |
          echo === Building DLL ===
          cd ext

          for /f "delims=" %%i in ('php -r "echo PHP_VERSION_ID;"') do set PHP_VERSION_ID=%%i
          for /f "delims=" %%i in ('php -r "echo PHP_PREFIX;"') do set PHP_PREFIX=%%i

